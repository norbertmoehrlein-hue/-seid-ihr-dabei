const { useState, useEffect, useCallback, useRef } = React;

const SUPABASE_URL = "https://bkfrxxeosbvxzgeaglhx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_a9OLrKfd5AqyAWsVsMQwDA_1g-ADeb1";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const storage = {
  async get(key) {
    const { data, error } = await supabaseClient
      .from("kv_store")
      .select("value")
      .eq("key", key)
      .maybeSingle();
    if (error) { console.error("storage.get Fehler:", error); throw error; }
    if (!data) return null;
    return { key, value: data.value, shared: true };
  },
  async set(key, value) {
    const { error } = await supabaseClient
      .from("kv_store")
      .upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) { console.error("storage.set Fehler:", error); throw error; }
    return { key, value, shared: true };
  },
  async delete(key) {
    const { error } = await supabaseClient.from("kv_store").delete().eq("key", key);
    if (error) { console.error("storage.delete Fehler:", error); throw error; }
    return { key, deleted: true, shared: true };
  },
};


// ---------- Hilfsfunktionen ----------

const ID_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // ohne I,O,0,1 (Verwechslungsgefahr)

function generateId(length = 6) {
  let id = "";
  for (let i = 0; i < length; i++) {
    id += ID_CHARS[Math.floor(Math.random() * ID_CHARS.length)];
  }
  return id;
}

function formatOptionLabel(date, time) {
  if (!date) return "";
  const d = new Date(date + "T00:00:00");
  const dateLabel = d.toLocaleDateString("de-DE", {
    weekday: "short",
    day: "2-digit",
    month: "short",
  });
  return time ? `${dateLabel} · ${time}` : dateLabel;
}

function pollKey(id) {
  return `poll:${id}`;
}

// ---------- Hauptkomponente ----------

function App() {
  const [screen, setScreen] = useState("home"); // home | create | poll
  const [joinCode, setJoinCode] = useState("");
  const [joinError, setJoinError] = useState("");
  const [pollId, setPollId] = useState(null);
  const [adminPolls, setAdminPolls] = useState({}); // pollId -> true, wenn in dieser Sitzung erstellt

  // Direkt-Link: wenn die Seite mit #CODE aufgerufen wird, gleich die passende Umfrage öffnen
  useEffect(() => {
    try {
      const hash = window.location.hash.replace("#", "").trim().toUpperCase();
      if (hash) {
        setPollId(hash);
        setScreen("poll");
      }
    } catch (e) {
      // Hash-Zugriff nicht möglich, einfach normal starten
    }
  }, []);

  const openPoll = (id) => {
    const clean = id.trim().toUpperCase();
    if (!clean) {
      setJoinError("Bitte gib einen Code ein.");
      return;
    }
    setJoinError("");
    setPollId(clean);
    setScreen("poll");
    try {
      window.location.hash = clean;
    } catch (e) {}
  };

  const goHome = () => {
    setScreen("home");
    try {
      window.location.hash = "";
    } catch (e) {}
  };

  return (
    <div className="wp-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        .wp-root {
          --card: rgba(41, 27, 17, 0.90);
          --ink: #f4e9d8;
          --ink-soft: #cbb494;
          --line: rgba(233, 205, 158, 0.22);
          --teal: #b9722e;
          --teal-dark: #e8b86d;
          --mustard: #d9a441;
          --forest: #90ab6c;
          --rust: #c1573c;

          background:
            linear-gradient(180deg, rgba(18, 11, 6, 0.86), rgba(15, 9, 5, 0.93)),
            url("${BG_IMAGE}") center/cover fixed;
          color: var(--ink);
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          min-height: 100%;
          padding: 20px 16px 40px;
          box-sizing: border-box;
        }
        .wp-root * { box-sizing: border-box; }
        .wp-brand {
          font-family: 'Fraunces', Georgia, serif;
          font-weight: 600;
          font-size: 26px;
          letter-spacing: -0.01em;
          margin: 0 0 4px;
          color: var(--teal-dark);
          text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }
        .wp-tag {
          font-size: 13.5px;
          color: var(--ink-soft);
          margin: 0 0 22px;
          line-height: 1.5;
        }
        .wp-card {
          background: var(--card);
          border: 1px solid var(--line);
          border-radius: 10px;
          padding: 18px;
          margin-bottom: 14px;
          backdrop-filter: blur(3px);
          box-shadow: 0 6px 18px rgba(0,0,0,0.28);
        }
        .wp-label {
          display: block;
          font-size: 13px;
          color: var(--ink-soft);
          margin-bottom: 6px;
        }
        .wp-input, .wp-textarea, .wp-date, .wp-time {
          width: 100%;
          padding: 10px 12px;
          border: 1px solid rgba(0,0,0,0.18);
          border-radius: 7px;
          font-size: 15px;
          font-family: inherit;
          background: #f6ecdc;
          color: #2c1c10;
        }
        .wp-input:focus, .wp-textarea:focus, .wp-date:focus, .wp-time:focus, button:focus-visible {
          outline: 2px solid var(--teal);
          outline-offset: 1px;
        }
        .wp-textarea { resize: vertical; min-height: 60px; }
        .wp-row { display: flex; gap: 8px; }
        .wp-row > * { flex: 1; }
        .wp-btn {
          border: none;
          border-radius: 7px;
          padding: 11px 18px;
          font-size: 15px;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          transition: opacity 0.15s;
        }
        .wp-btn:hover { opacity: 0.88; }
        .wp-btn:active { opacity: 0.75; }
        .wp-btn-primary { background: var(--teal); color: #fff; }

          background: transparent;

          border: 1px solid var(--line);
        }

function CreatePoll({ onBack, onCreated }) {
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [options, setOptions] = useState([{ date: "", time: "", max: "", desc: "", tables: [] }]);
  const [error, setError] = useState("");
  const [saving, setSaving] = useState(false);

  const updateOption = (i, field, value) => {
    setOptions((prev) => prev.map((o, idx) => (idx === i ? { ...o, [field]: value } : o)));
  };
  const addOption = () => setOptions((prev) => [...prev, { date: "", time: "", max: "", desc: "", tables: [] }]);
  const removeOption = (i) => setOptions((prev) => prev.filter((_, idx) => idx !== i));

  const addTable = (i) =>
    setOptions((prev) => prev.map((o, idx) => (idx === i ? { ...o, tables: [...o.tables, { name: "", capacity: "" }] } : o)));
  const updateTable = (i, ti, field, value) =>
    setOptions((prev) =>
      prev.map((o, idx) =>
        idx === i ? { ...o, tables: o.tables.map((t, tidx) => (tidx === ti ? { ...t, [field]: value } : t)) } : o
      )
    );
  const removeTable = (i, ti) =>
    setOptions((prev) =>
      prev.map((o, idx) => (idx === i ? { ...o, tables: o.tables.filter((_, tidx) => tidx !== ti) } : o))
    );

  const handleCreate = async () => {
    setError("");
    if (!title.trim()) { setError("Bitte gib einen Titel ein."); return; }
    const validOptions = options.filter((o) => o.date);
    if (validOptions.length === 0) { setError("Bitte füge mindestens einen Termin hinzu."); return; }

    setSaving(true);
    const id = generateId();
    const adminKey = generateId(8);
    const poll = {
      title: title.trim(),
      description: description.trim(),
      createdAt: new Date().toISOString(),
      adminKey,
      options: validOptions.map((o, i) => {
        const tables = o.tables
          .filter((t) => t.capacity && Number(t.capacity) > 0)
          .map((t, ti) => ({ id: `t${ti}`, name: t.name.trim() || `Tisch ${ti + 1}`, capacity: Number(t.capacity) }));
        return {
          id: `o${i}`,
          date: o.date,
          time: o.time,
          label: formatOptionLabel(o.date, o.time),
          description: o.desc.trim(),
          maxParticipants: o.max && Number(o.max) > 0 ? Number(o.max) : null,
          tables,
          closed: false,
          archived: false,
        };
      }),
      responses: {},
    };

    try {
      const result = await storage.set(pollKey(id), JSON.stringify(poll));
      if (!result) {
        setError("Speichern fehlgeschlagen. Bitte versuch es nochmal.");
        setSaving(false);
        return;
      }
      onCreated(id);
    } catch (e) {
      setError("Speichern fehlgeschlagen. Bitte versuch es nochmal.");
      setSaving(false);
    }
  };

  return (
    <div>
      <button className="wp-back" onClick={onBack}>← Zurück</button>
      <h1 className="wp-brand">Neue Umfrage</h1>

      <div className="wp-card">
        <span className="wp-label">Titel</span>
        <input className="wp-input" style={{ marginBottom: 14 }} placeholder="z. B. Teamausflug Herbst"
          value={title} onChange={(e) => setTitle(e.target.value)} />

        <span className="wp-label">Beschreibung (optional)</span>
        <textarea className="wp-textarea" placeholder="Ein paar Worte zum Anlass..."
          value={description} onChange={(e) => setDescription(e.target.value)} />
      </div>

      <div className="wp-card">
        <span className="wp-label">Terminvorschläge</span>
        {options.map((o, i) => (
          <div className="wp-optionblock" key={i}>
            <div className="wp-optionrow">
              <input type="date" className="wp-date" value={o.date} onChange={(e) => updateOption(i, "date", e.target.value)} />
              <input type="time" className="wp-time" value={o.time} onChange={(e) => updateOption(i, "time", e.target.value)} />
              <input
                type="number"
                min="1"
                className="wp-input wp-max"
                placeholder="Plätze"
                value={o.max}
                onChange={(e) => updateOption(i, "max", e.target.value)}
              />
              {options.length > 1 && (
                <button className="wp-remove" onClick={() => removeOption(i)} aria-label="Termin entfernen">×</button>
              )}
            </div>
            <input
              className="wp-input wp-optiondesc"
              placeholder="Kurze Beschreibung zu diesem Termin (optional)"
              value={o.desc}
              onChange={(e) => updateOption(i, "desc", e.target.value)}
            />

            <div className="wp-tables-setup">
              <span className="wp-hint" style={{ margin: "8px 0 4px" }}>
                {o.tables.length > 0 ? "Tische (die Platzzahl oben gilt dann nicht mehr):" : "Optional: statt einer Platzzahl in Tische aufteilen"}
              </span>
              {o.tables.map((t, ti) => (
                <div className="wp-optionrow" key={ti}>
                  <input
                    className="wp-input"
                    placeholder={`Tisch ${ti + 1} (Name)`}
                    value={t.name}
                    onChange={(e) => updateTable(i, ti, "name", e.target.value)}
                  />
                  <input
                    type="number"
                    min="1"
                    className="wp-input wp-max"
                    placeholder="Plätze"
                    value={t.capacity}
                    onChange={(e) => updateTable(i, ti, "capacity", e.target.value)}
                  />
                  <button className="wp-remove" onClick={() => removeTable(i, ti)} aria-label="Tisch entfernen">×</button>
                </div>
              ))}
              <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={() => addTable(i)}>+ Tisch hinzufügen</button>
            </div>
          </div>
        ))}
        <p className="wp-hint">Plätze leer lassen für unbegrenzt viele Teilnehmende.</p>
        <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={addOption}>+ Weiteren Termin hinzufügen</button>
      </div>

      {error && <p className="wp-error">{error}</p>}

      <button className="wp-btn wp-btn-primary wp-btn-block" onClick={handleCreate} disabled={saving}>
        {saving ? "Wird erstellt…" : "Umfrage erstellen"}
      </button>
    </div>
  );
}

function PollView({ pollId, onBack, startAdmin }) {
  const [poll, setPoll] = useState(null);
  const [loading, setLoading] = useState(true);
  const [notFound, setNotFound] = useState(false);
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [draftSizes, setDraftSizes] = useState({}); // optionId -> Anzahl Personen
  const [sizeErrors, setSizeErrors] = useState({}); // optionId -> Fehlermeldung bei zu hoher Anzahl
  const [tableHints, setTableHints] = useState({}); // optionId -> Hinweis, dass Wunschtisch evtl. nicht reicht
  const [draftTable, setDraftTable] = useState({}); // optionId -> gewählte Tisch-ID
  const [draftPickup, setDraftPickup] = useState({}); // optionId -> true = Abholer, zählt nicht als Platz
  const [saveMsg, setSaveMsg] = useState("");
  const [saving, setSaving] = useState(false);
  const [copyMsg, setCopyMsg] = useState("Kopieren");
  const [linkCopyMsg, setLinkCopyMsg] = useState("Link kopieren");
  const [selectedOptionId, setSelectedOptionId] = useState(null);
  const [editingKey, setEditingKey] = useState(null);
  const [editValue, setEditValue] = useState("");
  const [editError, setEditError] = useState("");
  const [templateFormFor, setTemplateFormFor] = useState(null);
  const [templateDate, setTemplateDate] = useState("");
  const [templateTime, setTemplateTime] = useState("");
  const [isAdmin, setIsAdmin] = useState(!!startAdmin);
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [adminCodeInput, setAdminCodeInput] = useState("");
  const [showMediaForm, setShowMediaForm] = useState(false);
  const [mediaError, setMediaError] = useState("");
  const [mediaBusy, setMediaBusy] = useState(false);
  const [videoLinkInput, setVideoLinkInput] = useState("");
  const [adminError, setAdminError] = useState("");
  const [adminBusy, setAdminBusy] = useState(false);
  const [confirmAction, setConfirmAction] = useState(null); // { message, run }
  const pollRef = useRef(null);

  const fullKey = `${firstName.trim()} ${lastName.trim()}`.trim();

  const fetchPoll = useCallback(async (silent) => {
    if (!silent) setLoading(true);
    try {
      const result = await storage.get(pollKey(pollId));
      if (result && result.value) {
        const parsed = JSON.parse(result.value);
        pollRef.current = parsed;
        setPoll(parsed);
        setNotFound(false);
      } else {
        setNotFound(true);
      }
    } catch (e) {
      setNotFound(true);
    }
    if (!silent) setLoading(false);
  }, [pollId]);

  useEffect(() => {
    fetchPoll(false);
    const interval = setInterval(() => fetchPoll(true), 5000);
    return () => clearInterval(interval);
  }, [fetchPoll]);

  useEffect(() => {
    // Nur beim Eintippen des (bereits bekannten) Namens die gespeicherten Werte
    // vorausfüllen - NICHT bei jedem Hintergrund-Refresh (sonst würde eine gerade
    // eingetippte, noch nicht gespeicherte Anzahl alle paar Sekunden zurückgesetzt).
    const current = pollRef.current;
    if (current && fullKey && current.responses[fullKey]) {
      const sizes = {};
      Object.entries(current.responses[fullKey].groupSizes || {}).forEach(([optId, n]) => {
        sizes[optId] = String(n);
      });
      setDraftSizes(sizes);
      setDraftTable(current.responses[fullKey].tableChoice || {});
      setDraftPickup(current.responses[fullKey].pickup || {});
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fullKey]);

  const totalForOptionExcluding = useCallback(
    (source, optionId, excludeKey) =>
      Object.entries(source.responses).reduce(
        (n, [key, r]) =>
          n + (key !== excludeKey && !(r.pickup && r.pickup[optionId]) ? Number(r.groupSizes[optionId] || 0) : 0),
        0
      ),
    []
  );

  const tableCapacityTotal = (o) => (o.tables || []).reduce((s, t) => s + t.capacity, 0);

  const bookedForTable = useCallback(
    (source, optionId, tableId, excludeKey) =>
      Object.entries(source.responses).reduce(
        (n, [key, r]) =>
          n + (key !== excludeKey && r.tableChoice && r.tableChoice[optionId] === tableId ? Number(r.groupSizes[optionId] || 0) : 0),
        0
      ),
    []
  );

  const handleSizeChange = (optionId, rawValue) => {
    setSaveMsg("");
    const value = rawValue === "" ? "" : Math.max(0, parseInt(rawValue, 10) || 0);
    const option = poll.options.find((o) => o.id === optionId);
    let overLimitMsg = "";
    let hintMsg = "";
    if (option && value !== "" && value > 0 && !draftPickup[optionId]) {
      if (option.tables && option.tables.length > 0) {
        const table = option.tables.find((t) => t.id === draftTable[optionId]);
        if (table) {
          const remaining = table.capacity - bookedForTable(poll, optionId, table.id, fullKey);
          if (value > remaining) {
            const anyFits = option.tables.some((t) => {
              const rem = t.capacity - bookedForTable(poll, optionId, t.id, fullKey);
              return rem >= value;
            });
            if (anyFits) {
              hintMsg = `Dein Wunschtisch "${table.name}" hat nur noch ${Math.max(0, remaining)} Platz(-e) frei – falls das nicht reicht, teilen wir dich beim Speichern automatisch an einem anderen Tisch mit Platz ein.`;
            } else {
              overLimitMsg = "Für diese Anzahl ist aktuell an keinem Tisch mehr genug Platz frei.";
            }
          }
        }
      } else if (option.maxParticipants != null) {
        const remaining = option.maxParticipants - totalForOptionExcluding(poll, optionId, fullKey);
        if (value > remaining) {
          overLimitMsg = remaining <= 0 ? "Für diesen Termin sind keine Plätze mehr frei." : `Für diesen Termin sind nur noch ${remaining} Platz(-e) frei.`;
        }
      }
    }
    setDraftSizes((prev) => ({ ...prev, [optionId]: String(value) }));
    setSizeErrors((prev) => ({ ...prev, [optionId]: overLimitMsg }));
    setTableHints((prev) => ({ ...prev, [optionId]: hintMsg }));
  };

  const handleTableChange = (optionId, tableId) => {
    setSaveMsg("");
    setDraftTable((prev) => ({ ...prev, [optionId]: tableId }));
    setDraftSizes((prev) => ({ ...prev, [optionId]: "" }));
    setSizeErrors((prev) => ({ ...prev, [optionId]: "" }));
    setTableHints((prev) => ({ ...prev, [optionId]: "" }));
  };

  const handleTogglePickup = (optionId) => {
    setSaveMsg("");
    setDraftPickup((prev) => ({ ...prev, [optionId]: !prev[optionId] }));
    setDraftSizes((prev) => ({ ...prev, [optionId]: "" }));
    setDraftTable((prev) => ({ ...prev, [optionId]: null }));
    setSizeErrors((prev) => ({ ...prev, [optionId]: "" }));
    setTableHints((prev) => ({ ...prev, [optionId]: "" }));
  };

  const handleSubmit = async (overrides) => {
    setSaveMsg("");
    if (!firstName.trim() || !lastName.trim()) {
      setSaveMsg("error:Bitte gib Vor- und Nachnamen ein.");
      return;
    }
    const hasOpenSizeError = Object.values(sizeErrors).some((msg) => msg);
    if (hasOpenSizeError) {
      setSaveMsg("error:Bitte korrigiere zuerst die zu hoch eingegebene Anzahl (rot markiert).");
      return;
    }
    const sizesSource = { ...draftSizes, ...(overrides || {}) };
    const groupSizes = {};
    poll.options.forEach((o) => {
      const n = Number(sizesSource[o.id] || 0);
      if (n > 0) groupSizes[o.id] = n;
    });

    // Für Termine mit Tischen: Tischwunsch prüfen (außer bei Abholern, die brauchen keinen Tisch)
    for (const o of poll.options) {
      if (groupSizes[o.id] && !draftPickup[o.id] && o.tables && o.tables.length > 0 && !draftTable[o.id]) {
        setSaveMsg(`error:Bitte wähle einen Tischwunsch für "${o.label}".`);
        return;
      }
    }

    setSaving(true);
    try {
      const fresh = await storage.get(pollKey(pollId));
      const current = fresh && fresh.value ? JSON.parse(fresh.value) : poll;

      const finalTableChoice = { ...draftTable };
      const reassignNotes = [];

      // Geschlossene Termine und Plätze/Tische gegen den aktuellsten Stand prüfen
      for (const o of current.options) {
        if (!groupSizes[o.id]) continue;
        if (o.closed) {
          setSaveMsg(`error:Die Anmeldung für "${o.label}" ist geschlossen.`);
          setSaving(false);
          return;
        }
        if (draftPickup[o.id]) continue; // Abholer zählen nicht als Plätze, keine Kapazitätsprüfung
        if (o.tables && o.tables.length > 0) {
          const wishedTable = o.tables.find((t) => t.id === draftTable[o.id]);
          if (!wishedTable) {
            setSaveMsg(`error:Bitte wähle einen Tischwunsch für "${o.label}".`);
            setSaving(false);
            return;
          }
          const wishedRemaining = wishedTable.capacity - bookedForTable(current, o.id, wishedTable.id, fullKey);
          if (groupSizes[o.id] <= wishedRemaining) {
            finalTableChoice[o.id] = wishedTable.id;
          } else {
            // Wunschtisch passt nicht mehr - automatisch einen anderen Tisch mit genug Platz suchen
            const altTable = o.tables.find((t) => {
              if (t.id === wishedTable.id) return false;
              const remaining = t.capacity - bookedForTable(current, o.id, t.id, fullKey);
              return groupSizes[o.id] <= remaining;
            });
            if (altTable) {
              finalTableChoice[o.id] = altTable.id;
              reassignNotes.push(`Dein Wunschtisch "${wishedTable.name}" war leider voll – wir haben dich stattdessen an "${altTable.name}" gesetzt.`);
            } else {
              setSaveMsg(`error:Für deine Gruppengröße ist bei "${o.label}" an keinem Tisch mehr genug Platz frei.`);
              setSaving(false);
              return;
            }
          }
        } else if (o.maxParticipants) {
          const others = totalForOptionExcluding(current, o.id, fullKey);
          if (others + groupSizes[o.id] > o.maxParticipants) {
            setSaveMsg(`error:Für "${o.label}" sind nur noch ${Math.max(0, o.maxParticipants - others)} Plätze frei.`);
            setSaving(false);
            return;
          }
        }
      }

      const tableChoice = {};
      const pickup = {};
      current.options.forEach((o) => {
        if (!groupSizes[o.id]) return;
        if (draftPickup[o.id]) pickup[o.id] = true;
        else if (o.tables && o.tables.length > 0) tableChoice[o.id] = finalTableChoice[o.id];
      });

      const responses = { ...current.responses };
      if (Object.keys(groupSizes).length === 0) {
        delete responses[fullKey];
      } else {
        responses[fullKey] = { firstName: firstName.trim(), lastName: lastName.trim(), groupSizes, tableChoice, pickup };
      }
      const updated = { ...current, responses };
      const result = await storage.set(pollKey(pollId), JSON.stringify(updated));
      if (!result) throw new Error("save failed");
      setPoll(updated);
      pollRef.current = updated;
      const baseMsg = Object.keys(groupSizes).length === 0 ? "Du wurdest ausgetragen." : "Deine Anmeldung wurde gespeichert.";
      setSaveMsg("ok:" + [baseMsg, ...reassignNotes].join(" "));
      // Formular leeren, damit die nächste Person direkt loslegen kann
      setFirstName("");
      setLastName("");
      setDraftSizes({});
      setDraftTable({});
      setDraftPickup({});
      setSizeErrors({});
      setTableHints({});
    } catch (e) {
      setSaveMsg("error:Speichern fehlgeschlagen. Bitte versuch es nochmal.");
    }
    setSaving(false);
  };

  const handleUnregister = (optionId) => handleSubmit({ [optionId]: 0 });

  // ---------- Admin-Funktionen ----------

  const tryUnlockAdmin = () => {
    if (poll && adminCodeInput.trim() && adminCodeInput.trim() === poll.adminKey) {
      setIsAdmin(true);
      setAdminError("");
      setShowAdminLogin(false);
    } else {
      setAdminError("Der Code ist leider falsch.");
    }
  };

  const withFreshPoll = async (mutateFn) => {
    setAdminBusy(true);
    try {
      const fresh = await storage.get(pollKey(pollId));
      const current = fresh && fresh.value ? JSON.parse(fresh.value) : poll;
      const updated = mutateFn(current);
      const result = await storage.set(pollKey(pollId), JSON.stringify(updated));
      if (!result) throw new Error("save failed");
      setPoll(updated);
      pollRef.current = updated;
    } catch (e) {
      setSaveMsg("error:Aktion fehlgeschlagen. Bitte versuch es nochmal.");
    }
    setAdminBusy(false);
  };

  const removeOptionFromResponses = (responses, optionId) => {
    const result = {};
    Object.entries(responses).forEach(([key, r]) => {
      const restSizes = { ...r.groupSizes };
      delete restSizes[optionId];
      if (Object.keys(restSizes).length > 0) result[key] = { ...r, groupSizes: restSizes };
    });
    return result;
  };

  const toggleClosed = (optionId) =>
    withFreshPoll((current) => ({
      ...current,
      options: current.options.map((o) => (o.id === optionId ? { ...o, closed: !o.closed } : o)),
    }));

  const resetOptionRegistrations = (optionId) =>
    withFreshPoll((current) => ({
      ...current,
      responses: removeOptionFromResponses(current.responses, optionId),
    }));

  const deleteOption = async (optionId) => {
    await withFreshPoll((current) => ({
      ...current,
      options: current.options.filter((o) => o.id !== optionId),
      responses: removeOptionFromResponses(current.responses, optionId),
    }));
    setSelectedOptionId(null);
  };

  const archiveOption = async (optionId) => {
    await withFreshPoll((current) => ({
      ...current,
      options: current.options.map((o) => (o.id === optionId ? { ...o, archived: true, closed: true } : o)),
    }));
    setSelectedOptionId(null);
  };

  const restoreOption = (optionId) =>
    withFreshPoll((current) => ({
      ...current,
      options: current.options.map((o) => (o.id === optionId ? { ...o, archived: false } : o)),
    }));

  const createOptionFromTemplate = async (templateOption) => {
    if (!templateDate) return;
    const newOption = {
      id: `o${generateId(4)}`,
      date: templateDate,
      time: templateTime,
      label: formatOptionLabel(templateDate, templateTime),
      description: templateOption.description || "",
      maxParticipants: templateOption.maxParticipants,
      tables: templateOption.tables ? templateOption.tables.map((t) => ({ ...t })) : [],
      closed: false,
      archived: false,
    };
    await withFreshPoll((current) => ({
      ...current,
      options: [...current.options, newOption],
    }));
    setTemplateFormFor(null);
    setTemplateDate("");
    setTemplateTime("");
  };

  const removeParticipant = (key, optionId) =>
    withFreshPoll((current) => {
      const r = current.responses[key];
      if (!r) return current;
      const restSizes = { ...r.groupSizes };
      delete restSizes[optionId];
      const responses = { ...current.responses };
      if (Object.keys(restSizes).length > 0) responses[key] = { ...r, groupSizes: restSizes };
      else delete responses[key];
      return { ...current, responses };
    });

  const startEditParticipant = (key, currentSize) => {
    setEditingKey(key);
    setEditValue(String(currentSize));
    setEditError("");
  };
  const cancelEditParticipant = () => {
    setEditingKey(null);
    setEditValue("");
    setEditError("");
  };
  const saveEditParticipant = async (key, optionId) => {
    const newVal = Math.max(0, parseInt(editValue, 10) || 0);
    let blockedMsg = "";
    await withFreshPoll((current) => {
      const r = current.responses[key];
      if (!r) return current;
      const option = current.options.find((o) => o.id === optionId);
      const isPickupEntry = !!(r.pickup && r.pickup[optionId]);

      // Abholer zählen nicht als Plätze, keine Kapazitätsprüfung nötig
      if (!isPickupEntry && option) {
        const tableId = r.tableChoice && r.tableChoice[optionId];
        const table = tableId && option.tables ? option.tables.find((t) => t.id === tableId) : null;

        if (table) {
          const others = Object.entries(current.responses).reduce(
            (n, [k, rr]) =>
              n + (k !== key && rr.tableChoice && rr.tableChoice[optionId] === table.id ? Number(rr.groupSizes[optionId] || 0) : 0),
            0
          );
          const remaining = table.capacity - others;
          if (newVal > remaining) {
            blockedMsg = `An "${table.name}" ${remaining <= 0 ? "sind keine Plätze mehr frei" : `sind nur noch ${remaining} Platz(-e) frei`}.`;
          }
        } else if (option.maxParticipants != null) {
          const others = Object.entries(current.responses).reduce(
            (n, [k, rr]) => n + (k !== key ? Number(rr.groupSizes[optionId] || 0) : 0),
            0
          );
          const remaining = option.maxParticipants - others;
          if (newVal > remaining) {
            blockedMsg = remaining <= 0 ? "Für diesen Termin sind keine Plätze mehr frei." : `Für diesen Termin sind nur noch ${remaining} Platz(-e) frei.`;
          }
        }
      }

      if (blockedMsg) return current;

      const restSizes = { ...r.groupSizes };
      if (newVal > 0) restSizes[optionId] = newVal;
      else delete restSizes[optionId];
      const responses = { ...current.responses };
      if (Object.keys(restSizes).length > 0) responses[key] = { ...r, groupSizes: restSizes };
      else delete responses[key];
      return { ...current, responses };
    });

    if (blockedMsg) {
      setEditError(blockedMsg);
      return;
    }
    setEditingKey(null);
    setEditValue("");
    setEditError("");
  };

  const resetWholePoll = () => withFreshPoll((current) => ({ ...current, responses: {} }));

  // ---------- Fotos & Videos ----------

  const resizeImageFile = (file) =>
    new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden."));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Bild konnte nicht gelesen werden."));
        img.onload = () => {
          const maxDim = 1280;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

  const handlePhotoUpload = async (fileList) => {
    const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
    if (files.length === 0) return;
    setMediaError("");
    setMediaBusy(true);
    try {
      for (const file of files) {
        const dataUrl = await resizeImageFile(file);
        if (dataUrl.length > 1_800_000) {
          setMediaError(`"${file.name}" ist auch verkleinert noch zu groß und wurde übersprungen.`);
          continue;
        }
        await withFreshPoll((current) => {
          const media = Array.isArray(current.media) ? current.media : [];
          return {
            ...current,
            media: [...media, { id: generateId(6), type: "photo", dataUrl, uploadedAt: new Date().toISOString() }],
          };
        });
      }
    } catch (e) {
      setMediaError("Beim Hochladen ist etwas schiefgelaufen. Bitte versuch es erneut.");
    }
    setMediaBusy(false);
  };

  const addVideoLink = async () => {
    const url = videoLinkInput.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) {
      setMediaError("Bitte einen vollständigen Link eingeben (beginnend mit http:// oder https://).");
      return;
    }
    setMediaError("");
    setMediaBusy(true);
    await withFreshPoll((current) => {
      const media = Array.isArray(current.media) ? current.media : [];
      return {
        ...current,
        media: [...media, { id: generateId(6), type: "videoLink", url, uploadedAt: new Date().toISOString() }],
      };
    });
    setVideoLinkInput("");
    setMediaBusy(false);
  };

  const deleteMedia = (id) =>
    withFreshPoll((current) => ({
      ...current,
      media: (current.media || []).filter((m) => m.id !== id),
    }));

  const deleteWholePoll = async () => {
    setAdminBusy(true);
    try {
      await storage.delete(pollKey(pollId));
    } catch (e) {
      // ignore
    }
    setAdminBusy(false);
    onBack();
  };

  const askConfirm = (message, run) => setConfirmAction({ message, run });
  const runConfirm = async () => {
    if (!confirmAction) return;
    const { run } = confirmAction;
    setConfirmAction(null);
    await run();
  };

  const copyCode = async () => {
    try {
      await navigator.clipboard.writeText(pollId);
      setCopyMsg("Kopiert!");
      setTimeout(() => setCopyMsg("Kopieren"), 1500);
    } catch (e) {
      setCopyMsg("Code: " + pollId);
    }
  };

  const copyLink = async () => {
    try {
      const link = `${window.location.origin}${window.location.pathname}#${pollId}`;
      await navigator.clipboard.writeText(link);
      setLinkCopyMsg("Link kopiert!");
      setTimeout(() => setLinkCopyMsg("Link kopieren"), 1500);
    } catch (e) {
      setLinkCopyMsg("Kopieren fehlgeschlagen");
    }
  };

  if (loading) {
    return (
      <div>
        <button className="wp-back" onClick={onBack}>← Zurück</button>
        <p className="wp-empty">Umfrage wird geladen…</p>
      </div>
    );
  }

  if (notFound) {
    return (
      <div>
        <button className="wp-back" onClick={onBack}>← Zurück</button>
        <p className="wp-error">Zu diesem Code wurde keine Umfrage gefunden. Prüf den Code und versuch es erneut.</p>
      </div>
    );
  }

  const participants = Object.keys(poll.responses);
  const tally = poll.options.map((o, i) =>
    participants.reduce(
      (n, p) => n + (poll.responses[p].pickup && poll.responses[p].pickup[o.id] ? 0 : Number(poll.responses[p].groupSizes[o.id] || 0)),
      0
    )
  );
  const pickupTally = poll.options.map((o, i) =>
    participants.reduce((n, p) => n + (poll.responses[p].pickup && poll.responses[p].pickup[o.id] ? Number(poll.responses[p].groupSizes[o.id] || 0) : 0), 0)
  );

  const remainingFor = (optionId) => {
    const option = poll.options.find((o) => o.id === optionId);
    if (!option || option.maxParticipants == null) return null;
    return option.maxParticipants - totalForOptionExcluding(poll, optionId, fullKey);
  };

  const effectiveCapacity = (o) => (o.tables && o.tables.length > 0 ? tableCapacityTotal(o) : o.maxParticipants);

  const summaryFor = (o, i) => {
    const pickupNote = pickupTally[i] > 0 ? ` · +${pickupTally[i]} Abholer` : "";
    if (o.closed) return "Geschlossen" + pickupNote;
    const cap = effectiveCapacity(o);
    if (cap == null) return `${tally[i]} angemeldet` + pickupNote;
    if (tally[i] >= cap) return "Ausgebucht" + pickupNote;
    return (
      (o.tables && o.tables.length > 0
        ? `${cap - tally[i]} von ${cap} Plätzen frei (${o.tables.length} Tische)`
        : `${cap - tally[i]} von ${cap} frei`) + pickupNote
    );
  };

  const ConfirmBar = () =>
    confirmAction ? (
      <div className="wp-confirm">
        <span>{confirmAction.message}</span>
        <div className="wp-confirm-actions">
          <button className="wp-btn wp-btn-danger wp-btn-sm" onClick={runConfirm} disabled={adminBusy}>Ja, wirklich</button>
          <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={() => setConfirmAction(null)}>Abbrechen</button>
        </div>
      </div>
    ) : null;

  const AdminAccess = () =>
    isAdmin ? (
      <div className="wp-admin-badge">
        <span>Admin-Modus · Code: <strong>{poll.adminKey}</strong></span>
      </div>
    ) : (
      <div className="wp-admin-access">
        {showAdminLogin ? (
          <div className="wp-row" style={{ alignItems: "flex-start" }}>
            <input
              className="wp-input"
              placeholder="Admin-Code"
              value={adminCodeInput}
              onChange={(e) => setAdminCodeInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && tryUnlockAdmin()}
            />
            <button className="wp-btn wp-btn-ghost" style={{ flex: "0 0 auto" }} onClick={tryUnlockAdmin}>Bestätigen</button>
          </div>
        ) : (
          <button className="wp-adminlink" onClick={() => setShowAdminLogin(true)}>Admin-Zugang</button>
        )}
        {adminError && <p className="wp-error">{adminError}</p>}
      </div>
    );

  const MediaBlock = () => (
    <>
      <div className="wp-card" style={{ marginTop: 18 }}>
        {!showMediaForm ? (
          <button className="wp-adminlink" onClick={() => setShowMediaForm(true)}>
            📸 Fotos & Videos vom Abend
          </button>
        ) : (
          <>
            <span className="wp-label">Fotos & Videos vom Abend</span>

            <div style={{ marginBottom: 14 }}>
              <label className="wp-btn wp-btn-ghost wp-btn-sm" style={{ display: "inline-block", cursor: "pointer" }}>
                {mediaBusy ? "Lädt hoch…" : "📷 Foto(s) auswählen"}
                <input
                  type="file"
                  accept="image/*"
                  multiple
                  style={{ display: "none" }}
                  disabled={mediaBusy}
                  onChange={(e) => { handlePhotoUpload(e.target.files); e.target.value = ""; }}
                />
              </label>
              <p className="wp-hint" style={{ marginTop: 6 }}>Fotos werden automatisch verkleinert. Für Videos bitte einen Link teilen (z. B. Google Drive, YouTube).</p>
            </div>

            <div className="wp-row" style={{ marginBottom: 10 }}>
              <input
                className="wp-input"
                placeholder="Link zu einem Video einfügen"
                value={videoLinkInput}
                onChange={(e) => setVideoLinkInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addVideoLink()}
              />
              <button className="wp-btn wp-btn-primary" style={{ flex: "0 0 auto" }} onClick={addVideoLink} disabled={mediaBusy || !videoLinkInput.trim()}>
                Hinzufügen
              </button>
            </div>

            {mediaError && <p className="wp-error">{mediaError}</p>}

            {poll.media && poll.media.length > 0 ? (
              <div className="wp-media-grid">
                {[...poll.media]
                  .sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt))
                  .map((m) => (
                    <div className="wp-media-item" key={m.id}>
                      {m.type === "photo" ? (
                        <img src={m.dataUrl} alt="Foto vom Abend" />
                      ) : (
                        <a href={m.url} target="_blank" rel="noopener noreferrer" className="wp-media-videolink">
                          🎬<span>Video ansehen</span>
                        </a>
                      )}
                      {isAdmin && (
                        <button
                          className="wp-media-delete"
                          onClick={() => deleteMedia(m.id)}
                          title="Löschen"
                          aria-label="Löschen"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                  ))}
              </div>
            ) : (
              <p className="wp-empty">Noch nichts hochgeladen.</p>
            )}

            <div className="wp-savebar" style={{ marginTop: 14 }}>
              <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={() => { setShowMediaForm(false); setMediaError(""); setVideoLinkInput(""); }}>
                Schließen
              </button>
            </div>
          </>
        )}
      </div>
    </>
  );

  // ---------- Übersicht: alle Termine zur Auswahl ----------
  if (!selectedOptionId) {
    return (
      <div>
        <button className="wp-back" onClick={onBack}>← Zurück</button>
        <h1 className="wp-brand">{poll.title}</h1>
        {poll.description && <p className="wp-tag">{poll.description}</p>}

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8, flexWrap: "wrap" }}>
          <span className="wp-code-pill">{pollId}</span>
          <button className="wp-copybtn" onClick={copyCode}>{copyMsg}</button>
        </div>
        <div style={{ marginBottom: 18 }}>
          <button className="wp-copybtn" onClick={copyLink}>🔗 {linkCopyMsg}</button>
        </div>

        <span className="wp-label">Termin wählen</span>
        {poll.options.map((o, i) => {
          if (o.archived) return null;
          const full = o.closed || (effectiveCapacity(o) != null && tally[i] >= effectiveCapacity(o));
          return (
            <button className="wp-optionpick" key={o.id} onClick={() => setSelectedOptionId(o.id)}>
              <div className="wp-optionpick-main">
                <span className="wp-option-title">{o.label}</span>
                {o.description && <span className="wp-optionpick-desc">{o.description}</span>}
              </div>
              <span className={`wp-option-summary ${full ? "full" : "free"}`}>{summaryFor(o, i)}</span>
            </button>
          );
        })}

        <div className="wp-card" style={{ marginTop: 18 }}>
          <AdminAccess />
          {isAdmin && (
            <div className="wp-admin-actions">
              <button
                className="wp-btn wp-btn-ghost wp-btn-sm"
                onClick={() => askConfirm("Wirklich alle Anmeldungen der ganzen Umfrage löschen?", resetWholePoll)}
                disabled={adminBusy}
              >
                Alle Anmeldungen zurücksetzen
              </button>
              <button
                className="wp-btn wp-btn-danger wp-btn-sm"
                onClick={() => askConfirm("Umfrage wirklich endgültig löschen?", deleteWholePoll)}
                disabled={adminBusy}
              >
                Umfrage löschen
              </button>
            </div>
          )}
          <ConfirmBar />
        </div>

        <MediaBlock />

        {isAdmin && poll.options.some((o) => o.archived) && (
          <div className="wp-card">
            <span className="wp-label">Archiv (vergangene Termine)</span>
            {poll.options.map((o, i) => {
              if (!o.archived) return null;
              return (
                <div className="wp-archive-item" key={o.id}>
                  <div className="wp-optionpick-main">
                    <span className="wp-option-title">{o.label}</span>
                    {o.description && <span className="wp-optionpick-desc">{o.description}</span>}
                    <span className="wp-optionpick-desc">{tally[i]} Anmeldung(en) gespeichert</span>
                  </div>

                  {templateFormFor === o.id ? (
                    <div className="wp-template-form">
                      <div className="wp-row">
                        <input type="date" className="wp-input wp-date" value={templateDate} onChange={(e) => setTemplateDate(e.target.value)} />
                        <input type="time" className="wp-input wp-time" value={templateTime} onChange={(e) => setTemplateTime(e.target.value)} />
                      </div>
                      <div className="wp-admin-actions">
                        <button className="wp-btn wp-btn-primary wp-btn-sm" onClick={() => createOptionFromTemplate(o)} disabled={adminBusy || !templateDate}>
                          Termin erstellen
                        </button>
                        <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={() => setTemplateFormFor(null)}>Abbrechen</button>
                      </div>
                    </div>
                  ) : (
                    <div className="wp-admin-actions">
                      <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={() => restoreOption(o.id)} disabled={adminBusy}>
                        Wiederherstellen
                      </button>
                      <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={() => { setTemplateFormFor(o.id); setTemplateDate(""); setTemplateTime(""); }}>
                        Als Vorlage nutzen
                      </button>
                      <button
                        className="wp-btn wp-btn-danger wp-btn-sm"
                        onClick={() => askConfirm("Diesen archivierten Termin wirklich endgültig löschen?", () => deleteOption(o.id))}
                        disabled={adminBusy}
                      >
                        Endgültig löschen
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ---------- Detailansicht: ein Termin ----------
  const option = poll.options.find((o) => o.id === selectedOptionId);
  const optionIndex = poll.options.findIndex((o) => o.id === selectedOptionId);
  const list = participants
    .filter((p) => Number(poll.responses[p].groupSizes[option.id] || 0) > 0)
    .map((p) => ({
      key: p,
      name: `${poll.responses[p].firstName} ${poll.responses[p].lastName}`,
      size: poll.responses[p].groupSizes[option.id],
      pickup: !!(poll.responses[p].pickup && poll.responses[p].pickup[option.id]),
    }))
    .sort((a, b) => a.name.localeCompare(b.name, "de"));

  const remaining = remainingFor(option.id);
  const hasOwnEntry = Number(poll.responses[fullKey]?.groupSizes[option.id] || 0) > 0;
  const ownIsPickup = !!(poll.responses[fullKey]?.pickup && poll.responses[fullKey].pickup[option.id]);
  const ownTableId = poll.responses[fullKey]?.tableChoice?.[option.id];
  const hasTables = option.tables && option.tables.length > 0;
  const isPickup = !!draftPickup[option.id];
  const selectedTable = hasTables && !isPickup ? option.tables.find((t) => t.id === draftTable[option.id]) : null;
  const tableRemaining = selectedTable
    ? selectedTable.capacity - bookedForTable(poll, option.id, selectedTable.id, fullKey)
    : null;
  const anyTableHasRoom = hasTables
    ? option.tables.some((t) => t.capacity - bookedForTable(poll, option.id, t.id, fullKey) > 0)
    : false;
  const blocked = isPickup
    ? option.closed
    : hasTables
    ? option.closed || !selectedTable || (!anyTableHasRoom && draftTable[option.id] !== ownTableId)
    : option.closed || (remaining !== null && remaining <= 0 && !hasOwnEntry);
  const full = option.closed || (effectiveCapacity(option) != null && tally[optionIndex] >= effectiveCapacity(option));

  const renderRow = (item) => (
    <li key={item.key}>
      <span>{item.name}</span>
      {editingKey === item.key ? (
        <span className="wp-partlist-right wp-partlist-editing">
          <span className="wp-editrow">
            <input
              type="number"
              min="0"
              className={`wp-input wp-editinput ${editError ? "wp-input-error" : ""}`}
              value={editValue}
              autoFocus
              onChange={(e) => { setEditValue(e.target.value); if (editError) setEditError(""); }}
              onKeyDown={(e) => e.key === "Enter" && saveEditParticipant(item.key, option.id)}
            />
            <button className="wp-iconbtn" onClick={() => saveEditParticipant(item.key, option.id)} disabled={adminBusy} title="Speichern" aria-label="Änderung speichern">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 13l4 4L19 7" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </button>
            <button className="wp-iconbtn" onClick={cancelEditParticipant} title="Abbrechen" aria-label="Bearbeiten abbrechen">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" />
              </svg>
            </button>
          </span>
          {editError && <span className="wp-editerror">{editError}</span>}
        </span>
      ) : (
        <span className="wp-partlist-right">
          <span className="wp-partcount">{item.size}</span>
          <button
            className="wp-iconbtn"
            onClick={() => startEditParticipant(item.key, item.size)}
            title="Anzahl ändern"
            aria-label={`${item.name} ändern`}
          >
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 20l.9-3.6L16.6 4.7a1.5 1.5 0 012.1 0l.6.6a1.5 1.5 0 010 2.1L7.6 19.1 4 20z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          </button>
          <button
            className="wp-partremove"
            onClick={() => removeParticipant(item.key, option.id)}
            disabled={adminBusy}
            aria-label={`${item.name} austragen`}
            title="Austragen"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path className="wp-trash-lid" d="M4 7h16M9 7V4h6v3" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
              <path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              <line x1="10" y1="11" x2="10" y2="17" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
              <line x1="14" y1="11" x2="14" y2="17" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
            </svg>
          </button>
        </span>
      )}
    </li>
  );

  const seatedList = list.filter((item) => !item.pickup);
  const pickupList = list.filter((item) => item.pickup);
  const listWithTable = seatedList.map((item) => ({ ...item, tableId: poll.responses[item.key].tableChoice?.[option.id] }));

  return (
    <div>
      <button className="wp-back" onClick={() => setSelectedOptionId(null)}>← Alle Termine</button>


      <h1 className="wp-brand">{option.label}</h1>
      {option.description && <p className="wp-tag">{option.description}</p>}
      <p className={`wp-option-summary ${full ? "full" : "free"}`} style={{ display: "block", marginBottom: 16 }}>
        {summaryFor(option, optionIndex)}
      </p>

      <div className="wp-card">
        <span className="wp-label">Angemeldet ({list.length})</span>
        {list.length === 0 ? (
          <p className="wp-empty">Noch keine Anmeldungen für diesen Termin.</p>
        ) : (
          <>
            {hasTables ? (
              option.tables.map((t) => {
                const rows = listWithTable.filter((item) => item.tableId === t.id);
                const booked = bookedForTable(poll, option.id, t.id, null);
                return (
                  <div className="wp-table-group" key={t.id}>
                    <div className="wp-option-head">
                      <span className="wp-option-title">{t.name}</span>
                      <span className={`wp-option-summary ${booked >= t.capacity ? "full" : "free"}`}>
                        {booked} von {t.capacity} belegt
                      </span>
                    </div>
                    {rows.length === 0 ? (
                      <p className="wp-empty" style={{ padding: "2px 0 8px" }}>Noch niemand an diesem Tisch.</p>
                    ) : (
                      <ul className="wp-partlist">{rows.map(renderRow)}</ul>
                    )}
                  </div>
                );
              })
            ) : seatedList.length > 0 ? (
              <ul className="wp-partlist">{seatedList.map(renderRow)}</ul>
            ) : null}

            {pickupList.length > 0 && (
              <div className="wp-table-group">
                <div className="wp-option-head">
                  <span className="wp-option-title">Abholung (ohne Sitzplatz)</span>
                  <span className="wp-option-summary free">
                    {pickupList.reduce((s, i) => s + i.size, 0)} Person(en)
                  </span>
                </div>
                <ul className="wp-partlist">{pickupList.map(renderRow)}</ul>
              </div>
            )}
          </>
        )}
      </div>

      <div className="wp-card">
        <span className="wp-label">Deine Anmeldung</span>
        <div className="wp-row" style={{ marginBottom: 14 }}>
          <input className="wp-input" placeholder="Vorname" value={firstName} onChange={(e) => setFirstName(e.target.value)} />
          <input className="wp-input" placeholder="Nachname" value={lastName} onChange={(e) => setLastName(e.target.value)} />
        </div>

        {hasOwnEntry && (
          <p className="wp-hint">
            Du bist aktuell mit {poll.responses[fullKey].groupSizes[option.id]} Person(en)
            {ownIsPickup
              ? " zur Abholung"
              : hasTables && option.tables.find((t) => t.id === ownTableId)
              ? ` an ${option.tables.find((t) => t.id === ownTableId).name}`
              : ""}{" "}
            angemeldet.
          </p>
        )}

        {(
          <button
            type="button"
            className="wp-pickup-toggle"
            onClick={() => handleTogglePickup(option.id)}
            disabled={option.closed}
          >
            <span className={`wp-checkbox ${isPickup ? "checked" : ""}`}>{isPickup ? "✓" : ""}</span>
            Nur Abholung (kein Tisch nötig, zählt nicht als Platz)
          </button>
        )}

        {hasTables && !isPickup && (
          <div className="wp-tablepicker">
            <span className="wp-optlabel">Tischwunsch</span>
            {option.tables.map((t) => {
              const booked = bookedForTable(poll, option.id, t.id, fullKey);
              const tFull = booked >= t.capacity;
              return (
                <button
                  key={t.id}
                  className={`wp-tablepick ${draftTable[option.id] === t.id ? "active" : ""} ${tFull ? "full" : ""}`}
                  onClick={() => !option.closed && handleTableChange(option.id, t.id)}
                  disabled={option.closed}
                >
                  <span>{t.name}</span>
                  <span>{tFull ? "Ausgebucht" : `${t.capacity - booked} von ${t.capacity} frei`}</span>
                </button>
              );
            })}
            <p className="wp-hint">
              Falls dein Wunschtisch voll ist, teilen wir dich beim Speichern automatisch an einem freien Tisch ein.
            </p>
          </div>
        )}

        <div className="wp-group-row">
          <div className="wp-optlabel" style={{ marginBottom: 0 }}>Anzahl Personen (inkl. dir)</div>
          <input
            type="number"
            min="0"
            className={`wp-input wp-groupinput ${sizeErrors[option.id] ? "wp-input-error" : ""}`}
            placeholder="0"
            value={draftSizes[option.id] || ""}
            onChange={(e) => handleSizeChange(option.id, e.target.value)}
            disabled={blocked}
          />
        </div>
        {sizeErrors[option.id] && <p className="wp-error">{sizeErrors[option.id]}</p>}
        {!sizeErrors[option.id] && tableHints[option.id] && <p className="wp-tablehint">{tableHints[option.id]}</p>}
        {option.closed && <p className="wp-full-note">Die Anmeldung für diesen Termin ist geschlossen.</p>}
        {!option.closed && hasTables && !isPickup && !selectedTable && <p className="wp-hint">Bitte zuerst einen Tisch auswählen.</p>}
        {!option.closed && blocked && selectedTable && <p className="wp-full-note">An diesem Tisch sind alle Plätze belegt.</p>}
        {!option.closed && !hasTables && blocked && <p className="wp-full-note">Für diesen Termin sind alle Plätze belegt.</p>}

        <div className="wp-savebar">
          <button className="wp-btn wp-btn-primary" onClick={() => handleSubmit()} disabled={saving || blocked}>
            {saving ? "Speichert…" : "Anmeldung speichern"}
          </button>
          {hasOwnEntry && (
            <button className="wp-btn wp-btn-ghost" onClick={() => handleUnregister(option.id)} disabled={saving}>
              Austragen
            </button>
          )}
        </div>
        {saveMsg.startsWith("ok:") && <span className="wp-saved-msg">{saveMsg.slice(3)}</span>}
        {saveMsg.startsWith("error:") && <p className="wp-error">{saveMsg.slice(6)}</p>}
      </div>

      <div className="wp-card">
        <AdminAccess />
        {isAdmin && (
          <div className="wp-admin-actions">
            <button className="wp-btn wp-btn-ghost wp-btn-sm" onClick={() => toggleClosed(option.id)} disabled={adminBusy}>
              {option.closed ? "Anmeldung wieder öffnen" : "Anmeldung schließen"}
            </button>
            <button
              className="wp-btn wp-btn-ghost wp-btn-sm"
              onClick={() => askConfirm("Alle Anmeldungen für diesen Termin wirklich löschen?", () => resetOptionRegistrations(option.id))}
              disabled={adminBusy}
            >
              Teilnehmer zurücksetzen
            </button>
            <button
              className="wp-btn wp-btn-danger wp-btn-sm"
              onClick={() => askConfirm("Diesen Termin ins Archiv verschieben? Anmeldungen bleiben dabei erhalten und du kannst ihn später wiederherstellen oder als Vorlage nutzen.", () => archiveOption(option.id))}
              disabled={adminBusy}
            >
              Termin archivieren
            </button>
          </div>
        )}
        <ConfirmBar />
      </div>

      <MediaBlock />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
